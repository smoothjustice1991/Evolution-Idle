[/Script/EngineSettings.GameMapsSettings]
; The game is pure UI, so it runs on the engine's empty Entry map with the C++ game mode.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/EvolutionIdle.EvolutionGameMode

[ConsoleVariables]
; Skip Unreal's default splash image while the game loads (also hides the editor splash).
WindowsApplication.ShowSplash=0

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False

[/Script/Engine.UserInterfaceSettings]
; Keep the layout readable from 1280x720 upwards.
ApplicationScale=1.0

[SystemSettings]
t.MaxFPS=60

[OnlineSubsystemSteam]
; Development builds write this App ID to steam_appid.txt so Steam can start outside the Steam client.
; 480 is Valve's shared test app (Spacewar). Replace it with Evolution Idle's App ID from Steamworks;
; until then Steam ignores this game's achievements (they still unlock and save locally).
SteamDevAppId=480

[EvolutionIdle.Steam]
; Mirror achievement unlocks to Steam when Steam is running.
bEnabled=True
; Leave False so Play-in-Editor never talks to Steam. Achievements still unlock locally in the editor.
bEnableInEditor=False
; Set to the real App ID before release: a Shipping build started outside Steam relaunches through Steam.
; 0 = off.
ReleaseAppId=0
